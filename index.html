<!DOCTYPE html>

        </div>
    </header>

        function subscribeToSyncData() {
            if (!db || !syncCode) return;
            if (unsubscribe) unsubscribe();

            const syncDocRef = doc(db, 'flashcard_progress_kouki', syncCode);
            const statusEl = document.getElementById('sync-status');
            if (statusEl) statusEl.classList.remove('hidden');

            unsubscribe = onSnapshot(syncDocRef, (docSnap) => {
                isSyncing = true;
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    if (data.progress) {
                        wordData = initialWordList.map(item => {
                            const saved = data.progress.find(p => p.id === item.id);
                            if (!saved) return { ...item, latestResult: null, mistakeRound: null };
                            const history = saved.history || [];
                            const latestResult = saved.latestResult || (history.length > 0 ? history[history.length - 1] : null);
                            const mistakeRound = saved.mistakeRound !== undefined ? saved.mistakeRound : (latestResult === '×' ? currentRound : null);
                            return {
                                ...item,
                                mistakes: saved.mistakes || 0,
                                history: history,
                                latestResult: latestResult,
                                mistakeRound: mistakeRound
                            };
                        });
                        if (data.currentRound) {
                            currentRound = data.currentRound;
                            saveRound();
                        }
                        saveLocalProgress();
                        updateReviewBadge();
                    }

                    if (data.orderStates && data.orderStates.all && data.orderStates.all.indices && data.orderStates.all.indices.length === wordData.length) {
                        orderStates = data.orderStates;
                    } else if (data.orderState && data.orderState.shuffledIndices) {
                        orderStates.all.indices = data.orderState.shuffledIndices;
                        orderStates.all.currentIndex = data.orderState.currentOrderIndex || 0;
                    } else {
                        if (orderStates.all.indices.length === 0) initShuffle('all');
                    }
                    
                    if (learningMode === 'review' && getReviewWords().length === 0) {
                        learningMode = 'all';
                        updateModeUI();
                    }

                } else {
                    if (orderStates.all.indices.length === 0) initShuffle('all');
                    saveCloudData();
                }
                showCard();
                updateList();
                isSyncing = false;
            }, (error) => {
                console.warn("Firestore sync notification:", error);
                isSyncing = false;
            });
        }

        function initShuffle(mode) {
            let indices = [];
            if (mode === 'all') {
                const unattempted = [];
                const attempted = [];
                wordData.forEach((w, i) => {
                    if (!w.history || w.history.length === 0) {
                        unattempted.push(i);
                    } else {
                        attempted.push(i);
                    }
                });

                // まだ一度も解いていない単語があり、かつ一部解答済みがある場合（新単語追加時や途中進捗時）
                if (unattempted.length > 0 && attempted.length > 0) {
                    for (let i = attempted.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [attempted[i], attempted[j]] = [attempted[j], attempted[i]];
                    }
                    for (let i = unattempted.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [unattempted[i], unattempted[j]] = [unattempted[j], unattempted[i]];
                    }
                    indices = [...attempted, ...unattempted];
                    orderStates[mode].indices = indices;
                    orderStates[mode].currentIndex = attempted.length;
                    updateReviewBadge();
                    return;
                }

                // 全問未解答、または全問解答済みの場合は全問均等シャッフル
                indices = Array.from({ length: wordData.length }, (_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                orderStates[mode].indices = indices;
                orderStates[mode].currentIndex = 0;
            } else if (mode === 'review') {
                wordData.forEach((w, i) => {
                    if (w.mistakeRound === currentRound) {
                        indices.push(i);
                    }
                });
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                orderStates[mode].indices = indices;
                orderStates[mode].currentIndex = 0;
            }
            updateReviewBadge();
        }

        window.judge = function(isCorrect, event) {
            if (event) event.stopPropagation(); 

            const state = orderStates[learningMode];
            if (!state || state.indices.length === 0) return;

            const realIndex = state.indices[state.currentIndex];
            const word = wordData[realIndex];
            if (!word) return;
            
            // 直近5回分の履歴のみ保持
            const historyMark = isCorrect ? '〇' : '×';
            if (!word.history) word.history = [];
            word.history.push(historyMark);
            if (word.history.length > 5) {
                word.history.shift();
            }

            // 直近の回答結果を更新
            word.latestResult = historyMark;

            // 全問モードで間違えた場合、その単語の mistakeRound を現在の周に設定
            if (learningMode === 'all') {
                if (!isCorrect) {
                    word.mistakeRound = currentRound;
                }
            }
            // 復習モードでは正解しても mistakeRound は変更しない（復習モードから消えない！）

            if (!isCorrect) {
                word.mistakes += 1;
            }

            sessionCount++;
            updateReviewBadge();
            
            state.currentIndex++;
            const isModeFinished = state.currentIndex >= state.indices.length;

            saveCloudData();

            if (isModeFinished) {
                if (learningMode === 'all') {
                    promptRoundClearOrReview(false);
                    return;
                } else if (learningMode === 'review') {
                    promptRoundClearOrReview(true);
                    return;
                }
            }

            // 30問ごとの休憩チェック（完走時以外）
            if (sessionCount >= SESSION_LIMIT) {
                showModal('session', `🎉 ${SESSION_LIMIT}問クリアしました！\nお疲れ様です。少し休憩しますか？`, 'このまま続ける', () => {

                    closeModal();
                    switchTab('list');
                });
            } else {
                showCard();
            }
        };

            if (btnReview && btnAll) {
                if (filter === 'review') {
                    btnReview.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-900 shadow transition-all";
                    btnAll.className = "px-4 py-1.5 rounded-full text-xs font-bold text-white/80 hover:text-white transition-all";
                } else {
                    btnAll.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-900 shadow transition-all";
                    btnReview.className = "px-4 py-1.5 rounded-full text-xs font-bold text-white/80 hover:text-white transition-all";
                }
            }
            updateList();
        };

        function updateList() {
            const tbody = document.getElementById('mistake-list-body');
            const noMsg = document.getElementById('no-mistakes-msg');
            tbody.innerHTML = '';

            let displayWords = [];
            if (listFilter === 'review') {
                displayWords = wordData.filter(word => word.mistakeRound === currentRound);
            } else {
                displayWords = wordData.filter(word => word.mistakes > 0 || (word.history && word.history.length > 0));
            }

            if (displayWords.length === 0) {
                document.querySelector('table').classList.add('hidden');
                noMsg.classList.remove('hidden');
                if (listFilter === 'review') {
                    noMsg.innerHTML = `第${currentRound}周で間違えた単語はありません！<br>素晴らしい正解率です！🎉`;
                } else {
                    noMsg.innerHTML = 'まだ履歴のある単語はありません。どんどん問題を解いていきましょう！📚';
                }
                return;
            } else {
                document.querySelector('table').classList.remove('hidden');
                noMsg.classList.add('hidden');
            }

            displayWords.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];
                
                if (currentSort.key === 'mistakes') {
                    return currentSort.order === 'asc' ? valA - valB : valB - valA;
                } else {
                    if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                    return 0;
                }
            });

            ['en', 'ja', 'mistakes'].forEach(key => {
                document.getElementById(`sort-icon-${key}`).textContent = '';
            });
            document.getElementById(`sort-icon-${currentSort.key}`).textContent = currentSort.order === 'asc' ? '▲' : '▼';

            displayWords.forEach(word => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100 hover:bg-orange-50/50 transition-colors";
                
                const isCurrentMistake = word.mistakeRound === currentRound;
                const statusBadge = isCurrentMistake
                    ? '<span class="bg-red-500 text-white text-[11px] px-2 py-0.5 rounded-full font-bold shadow-sm inline-block">今周ミス (×)</span>'
                    : '<span class="bg-emerald-500 text-white text-[11px] px-2 py-0.5 rounded-full font-bold shadow-sm inline-block">クリア (〇)</span>';

                const historyHtml = (word.history || []).map(mark => 
                    mark === '〇' ? '<span class="text-green-600 font-bold mx-1">〇</span>' : '<span class="text-red-600 font-bold mx-1">×</span>'
                ).join('');

                tr.innerHTML = `
                    <td class="px-5 py-4 text-sm font-bold text-gray-800">
                        <div class="flex items-center gap-2">
                            <span>${word.en}</span>
                            ${statusBadge}
                        </div>
                    </td>
                    <td class="px-5 py-4 text-sm text-gray-600">${word.ja}</td>
                    <td class="px-5 py-4 text-sm">
                        <div class="font-bold text-gray-700 mb-1">通算ミス: <span class="text-red-600 font-bold">${word.mistakes}回</span></div>
                        <div class="text-xs bg-gray-50 px-2 py-1 rounded inline-block border border-gray-200">
                            直近: ${historyHtml || '<span class="text-gray-400">記録なし</span>'}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.sortTable = function(key) {
            if (currentSort.key === key) {
                currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.order = key === 'mistakes' ? 'desc' : 'asc';
            }
            updateList();
        };

        function showModal(type, message, btn1Text, btn1Action, btn2Text = null, btn2Action = null) {
            const modal = document.getElementById('unified-modal');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const inputContainer = document.getElementById('modal-input-container');
            const btn1 = document.getElementById('modal-btn-primary');
            const btn2 = document.getElementById('modal-btn-secondary');
            
            titleEl.classList.add('hidden');
            inputContainer.classList.add('hidden');
            msgEl.innerHTML = message.replace(/\n/g, '<br>');
            
            btn1.textContent = btn1Text;
            btn1.onclick = btn1Action;
            
            if (btn2Text) {
                btn2.textContent = btn2Text;
                btn2.classList.remove('hidden');
                btn2.onclick = btn2Action;
            } else {
                btn2.classList.add('hidden');
            }
            
            if (type === 'danger') {
                btn1.className = "w-full py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300 font-bold transition-all text-lg shadow-sm";
            } else {
                btn1.className = "w-full py-3 bg-orange-600 text-white rounded-xl hover:bg-orange-700 focus:outline-none focus:ring-4 focus:ring-orange-300 font-bold transition-all text-lg shadow-sm";
            }
            
            modal.classList.remove('hidden');
        }

        function showInputModal(type, title, message, placeholder, btn1Text, onSubmit, btn2Text = null, btn2Action = null) {
            const modal = document.getElementById('unified-modal');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const inputContainer = document.getElementById('modal-input-container');
            const inputEl = document.getElementById('modal-input');
            const errorEl = document.getElementById('modal-input-error');
            const btn1 = document.getElementById('modal-btn-primary');
            const btn2 = document.getElementById('modal-btn-secondary');

            titleEl.textContent = title;
            titleEl.classList.remove('hidden');
            msgEl.innerHTML = message.replace(/\n/g, '<br>');
            
            inputEl.value = '';
            inputEl.placeholder = placeholder;
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
            inputContainer.classList.remove('hidden');

            btn1.textContent = btn1Text;
            btn1.onclick = () => {
                const val = inputEl.value.trim();
                const err = onSubmit(val);
                if (err) {
                    errorEl.textContent = err;
                    errorEl.classList.remove('hidden');
                } else {
                    closeModal();
                }
            };

            if (btn2Text) {
                btn2.textContent = btn2Text;
                btn2.classList.remove('hidden');
                btn2.onclick = btn2Action;
            } else {
                btn2.classList.add('hidden');
            }

            if (type === 'danger') {
                btn1.className = "w-full py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300 font-bold transition-all text-lg shadow-sm";
            } else {
                btn1.className = "w-full py-3 bg-orange-600 text-white rounded-xl hover:bg-orange-700 focus:outline-none focus:ring-4 focus:ring-orange-300 font-bold transition-all text-lg shadow-sm";
            }

            modal.classList.remove('hidden');
            setTimeout(() => inputEl.focus(), 100);
        }

        window.closeModal = function() {
            document.getElementById('unified-modal').classList.add('hidden');
            const inputContainer = document.getElementById('modal-input-container');
            if (inputContainer) inputContainer.classList.add('hidden');
        };

        window.initiateReset = function() {
            // 同期コードが未設定（空欄）の場合はリセット不可
            if (!syncCode) {
                showModal('alert', '⚠️ 同期コード（合言葉）が入力・設定されていません。\n子供の誤消去を防ぐため、同期コードが設定されている時のみ履歴をリセットできます。\n画面上部で同期コードを設定してから実行してください。', 'OK', closeModal);
                return;
            }

            // 同期コードが設定されている場合：合言葉の再確認モーダルを表示
            showInputModal(
                'danger',
                '履歴のリセット（保護者確認）',
                'すべての単語の正誤履歴をリセットします。\n実行するには、設定中の同期コード（合言葉）を入力してください。',
                '合言葉を入力',
                'リセットを実行する',
                (inputVal) => {
                    if (inputVal !== syncCode) {
                        return '⚠️ 同期コードが一致しません。';
                    }
                    executeReset();
                    showModal('alert', '✨ すべての正誤履歴をリセットしました。', 'OK', closeModal);
                    return null; // 成功
                },
                'キャンセル',
                closeModal
            );
        };

        function executeReset() {
            wordData.forEach(word => {
                word.mistakes = 0;
                word.history = [];
                word.latestResult = null;
                word.mistakeRound = null;
            });
            sessionCount = 0;
            currentRound = 1;
            saveRound();
            updateReviewBadge();
            learningMode = 'all';
            updateModeUI();
            initShuffle('all');
            initShuffle('review');
            saveCloudData();
            showCard();
            if(!document.getElementById('list-area').classList.contains('hidden')){
                updateList();
            }
        }

        // --- デイリー応援メッセージ（1日1回・初回起動時ランダム） ---
        const dailyCheerMessages = [
            "覚悟を決めろ！",
            "選択肢を狭めるな！",
            "今苦労して楽しい高校生活にしよ！",
            "ワラベこうき～Fightですよ～！",
            "頑張りすぎてもかすり傷！",
            "人生一回キリ。なんてな・・・！",
            "後悔先に立たずだぞ！",
            "高校決めて1人キャンプ行ってこい！",
            "レインボウブリッジ封鎖できませーん！",
            "頑張れオソマやろう！！"
        ];

        function checkDailyMessage() {
            try {
                // 日本標準時 (JST) で YYYY-MM-DD を取得
                const now = new Date();
                const jstDate = new Intl.DateTimeFormat('ja-JP', {
                    timeZone: 'Asia/Tokyo',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                }).format(now);

                const lastShown = localStorage.getItem('kouki_last_daily_msg_date');
                if (lastShown !== jstDate) {
                    const randIdx = Math.floor(Math.random() * dailyCheerMessages.length);
                    const chosenMsg = dailyCheerMessages[randIdx];
                    setTimeout(() => {
                        showModal('cheer',
                            chosenMsg,
                            'よし、やるぞ！🔥',
                            () => {
                                localStorage.setItem('kouki_last_daily_msg_date', jstDate);
                                closeModal();
                            }
                        );
                    }, 500);
                }
            } catch (e) {
                console.warn("Failed to check daily message:", e);
            }
        }

        // --- 確実な即時初期化 ---
        function startApp() {
            document.getElementById('sync-code-input').value = syncCode;
            totalWordsDisplay.textContent = wordData.length;
            loadSavedLocalProgress();
            saveRound();
            updateReviewBadge();
            if (!orderStates.all.indices || orderStates.all.indices.length !== wordData.length) {
                initShuffle('all');
            }
            if (!orderStates.review.indices) {
                initShuffle('review');
            }
            showCard();
            setupCloudSync();
            checkDailyMessage();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
