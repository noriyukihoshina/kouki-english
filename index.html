<!DOCTYPE html>
<html lang="ja">

        .rotate-y-180 { transform: rotateY(180deg); }

        </div>

                同期コード:

        </div>
    </header>

        // 最新の回答判定を取得（'〇' | '×' | null）
        function getWordLatestResult(word) {
            if (word.latestResult) return word.latestResult;
            if (word.history && word.history.length > 0) {
                return word.history[word.history.length - 1];
            }
            return null;
        }

        // 現在要復習（最新が×）の単語一覧を取得
        function getReviewWords() {
            return wordData.filter(w => getWordLatestResult(w) === '×');
        }

        function updateReviewBadge() {
            const count = getReviewWords().length;
            const badge = document.getElementById('review-count-badge');
            if (!badge) return;
            if (count > 0) {
                badge.textContent = `${count}問`;
                badge.classList.remove('hidden');
            } else {
                badge.textContent = '0問';
                badge.classList.add('hidden');
            }
        }

        function loadSavedLocalProgress() {
            try {
                const saved = localStorage.getItem('koki_progress_' + syncCode);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        wordData = initialWordList.map(item => {
                            const found = parsed.find(p => p.id === item.id);
                            if (!found) return { ...item, latestResult: null };
                            const history = found.history || [];
                            const latestResult = found.latestResult || (history.length > 0 ? history[history.length - 1] : null);
                            return {
                                ...item,
                                mistakes: found.mistakes || 0,
                                history: history,
                                latestResult: latestResult
                            };
                        });
                    }
                }
                const savedRound = localStorage.getItem('koki_current_round_' + syncCode);
                if (savedRound) {
                    currentRound = parseInt(savedRound, 10) || 1;
                }
                saveRound();
                updateReviewBadge();
            } catch (e) {
                console.warn("Failed to load local progress:", e);
            }
        }

        function saveLocalProgress() {
            try {
                const progress = wordData
                    .filter(w => w.mistakes > 0 || (w.history && w.history.length > 0) || w.latestResult)
                    .map(w => ({ 
                        id: w.id, 
                        mistakes: w.mistakes, 
                        history: w.history,
                        latestResult: w.latestResult 
                    }));
                localStorage.setItem('koki_progress_' + syncCode, JSON.stringify(progress));
                localStorage.setItem('koki_current_round_' + syncCode, currentRound.toString());
            } catch (e) {
                console.warn("Failed to save local progress:", e);
            }
        }

                        updateReviewBadge();
                    }

                    if (data.orderStates && data.orderStates.all && data.orderStates.all.indices && data.orderStates.all.indices.length === wordData.length) {
                        orderStates = data.orderStates;
                    } else if (data.orderState && data.orderState.shuffledIndices) {
                        orderStates.all.indices = data.orderState.shuffledIndices;
                        orderStates.all.currentIndex = data.orderState.currentOrderIndex || 0;
                    } else {
                        if (orderStates.all.indices.length === 0) initShuffle('all');
                    }
                    
                    if (learningMode === 'review' && getReviewWords().length === 0) {
                        learningMode = 'all';
                        updateModeUI();
                    }

                } else {
                    if (orderStates.all.indices.length === 0) initShuffle('all');
                    saveCloudData();
                }
                showCard();
                updateList();
                isSyncing = false;
            }, (error) => {
                console.error("Firestore sync error:", error);
                isSyncing = false;
            });
        }

        async function saveCloudData() {
            saveLocalProgress();
            if (!auth || !auth.currentUser || !db || isSyncing) return;
            
            const progress = wordData
                .filter(w => w.mistakes > 0 || (w.history && w.history.length > 0) || w.latestResult)
                .map(w => ({ 
                    id: w.id, 
                    mistakes: w.mistakes, 
                    history: w.history,
                    latestResult: w.latestResult 
                }));
                
            const syncDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'flashcard_progress_v3_240', syncCode);
            
            try {
                await setDoc(syncDocRef, { progress, orderStates, currentRound, updatedAt: new Date().toISOString() }, { merge: true });
            } catch (err) {
                console.warn("Failed to save to cloud:", err);
            }
        }

        function loadLocalData() {
            document.getElementById('sync-code-input').value = syncCode;
            loadSavedLocalProgress();
            if (orderStates.all.indices.length === 0) initShuffle('all');
            if (orderStates.review.indices.length === 0) initShuffle('review');
            showCard();
        }

        window.changeSyncCode = function() {
            const inputVal = document.getElementById('sync-code-input').value.trim();
            if (!inputVal) return;
            syncCode = inputVal;
            localStorage.setItem('flashcards_sync_code', syncCode);
            localStorage.setItem('kouki_flashcards_sync_code', syncCode);
            loadSavedLocalProgress();
            initShuffle('all');
            initShuffle('review');
            showCard();
            if (auth && auth.currentUser) {
                subscribeToSyncData();
            }
        };

        const cardInner = document.getElementById('card-inner');
        const wordEnEl = document.getElementById('word-en');
        const wordKanaEl = document.getElementById('word-kana');
        const wordJaEl = document.getElementById('word-ja');
        const frontMistakeCountEl = document.getElementById('front-mistake-count');
        const frontMistakeNumberEl = document.getElementById('front-mistake-number');
        const backMistakeCountEl = document.getElementById('back-mistake-count');
        const backMistakeNumberEl = document.getElementById('back-mistake-number');
        const judgmentControlsEl = document.getElementById('judgment-controls');
        const currentIndexDisplay = document.getElementById('current-index-display');
        const totalWordsDisplay = document.getElementById('total-words-display');
        const sessionCountDisplay = document.getElementById('session-count-display');

        function initShuffle(mode) {
            let indices = [];
            if (mode === 'all') {
                indices = Array.from({ length: wordData.length }, (_, i) => i);
            } else if (mode === 'review') {
                wordData.forEach((w, i) => {
                    if (getWordLatestResult(w) === '×') {
                        indices.push(i);
                    }
                });
            }

            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            orderStates[mode].indices = indices;
            orderStates[mode].currentIndex = 0;
            updateReviewBadge();
        }

        function updateModeUI() {
            const btnAll = document.getElementById('mode-all-btn');
            const btnReview = document.getElementById('mode-review-btn');
            const roundBadge = document.getElementById('round-badge');
            
            if (learningMode === 'all') {
                btnAll.className = "px-6 py-2 rounded-full font-bold text-sm bg-white text-gray-900 shadow transition-all duration-200";
                btnReview.className = "px-6 py-2 rounded-full font-bold text-sm text-white/80 hover:text-white transition-all duration-200";
                if (roundBadge) roundBadge.classList.remove('hidden');
            } else {
                btnReview.className = "px-6 py-2 rounded-full font-bold text-sm bg-white text-red-600 shadow transition-all duration-200";
                btnAll.className = "px-6 py-2 rounded-full font-bold text-sm text-white/80 hover:text-white transition-all duration-200";
                if (roundBadge) roundBadge.classList.add('hidden');
            }
            updateReviewBadge();
        }

        window.setMode = function(mode) {
            if (mode === 'review') {
                const reviewWords = getReviewWords();
                if (reviewWords.length === 0) {
                    showModal('alert', '現在、要復習（直近×）の単語はありません！\nすべて正解済みです。素晴らしい！🎉', '全問モードを続ける', closeModal);
                    return;
                }
            }
            
            learningMode = mode;
            updateModeUI();
            initShuffle(mode);
            showCard();
        };

        function showCard() {
            const state = orderStates[learningMode];
            if (!state || state.indices.length === 0) {
                if (learningMode === 'review') {
                    initShuffle('review');
                    if (orderStates.review.indices.length === 0) {
                        setMode('all');
                        return;
                    }
                } else {
                    initShuffle('all');
                }
            }
            
            const realIndex = state.indices[state.currentIndex];
            const word = wordData[realIndex];
            if (!word) return;
            
            wordEnEl.textContent = word.en;
            wordKanaEl.textContent = word.kana;
            wordJaEl.textContent = word.ja;
            
            if (word.en.length > 15) {
                wordEnEl.classList.replace('text-4xl', 'text-2xl');
                wordEnEl.classList.replace('md:text-5xl', 'md:text-3xl');
            } else {
                wordEnEl.classList.replace('text-2xl', 'text-4xl');
                wordEnEl.classList.replace('md:text-3xl', 'md:text-5xl');
            }

            currentIndexDisplay.textContent = state.currentIndex + 1;
            totalWordsDisplay.textContent = state.indices.length;
            sessionCountDisplay.textContent = sessionCount;

            const isCurrentMistake = getWordLatestResult(word) === '×';
            if (word.mistakes > 0 || isCurrentMistake) {
                frontMistakeNumberEl.textContent = word.mistakes;
                backMistakeNumberEl.textContent = word.mistakes;
                frontMistakeCountEl.classList.remove('hidden');
                backMistakeCountEl.classList.remove('hidden');
            } else {
                frontMistakeCountEl.classList.add('hidden');
                backMistakeCountEl.classList.add('hidden');
            }

            if (isFlipped) {
                cardInner.classList.remove('rotate-y-180');
                isFlipped = false;
            }
            judgmentControlsEl.classList.add('hidden');
            document.getElementById('flip-btn').classList.remove('hidden');
        }

        window.flipCard = function() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
                document.getElementById('flip-btn').classList.add('hidden');
                setTimeout(() => {
                    judgmentControlsEl.classList.remove('hidden');
                }, 150);
            }
        };

        window.judge = function(isCorrect, event) {
            if (event) event.stopPropagation(); 

            const state = orderStates[learningMode];
            if (!state || state.indices.length === 0) return;

            const realIndex = state.indices[state.currentIndex];
            const word = wordData[realIndex];
            if (!word) return;
            
            // 直近5回分の履歴のみ保持
            const historyMark = isCorrect ? '〇' : '×';
            if (!word.history) word.history = [];
            word.history.push(historyMark);
            if (word.history.length > 5) {
                word.history.shift();
            }

            // 直近の回答結果を更新（克服判定用）
            word.latestResult = historyMark;

            if (!isCorrect) {
                word.mistakes += 1;
            }

            sessionCount++;
            updateReviewBadge();
            
            state.currentIndex++;
            const isModeFinished = state.currentIndex >= state.indices.length;

            saveCloudData();

            if (isModeFinished) {
                if (learningMode === 'all') {
                    // === 240問（周回）完走時の節目イベント！ ===
                    const reviewWords = getReviewWords();
                    const mistakeCount = reviewWords.length;
                    const correctCount = wordData.length - mistakeCount;
                    const finishedRound = currentRound;

                    if (mistakeCount > 0) {
                        showModal('round_clear', 
                            `🏆 第${finishedRound}周目をクリアしました！（全240問）\n\n・正解（〇）: ${correctCount}問\n・要復習（×）: ${mistakeCount}問\n\n今周で間違えた${mistakeCount}問だけをすぐに復習しますか？`,
                            `間違えた${mistakeCount}問を復習する`,
                            () => {
                                closeModal();
                                sessionCount = 0;
                                currentRound++;
                                saveRound();
                                setMode('review');
                            },
                            `第${finishedRound + 1}周へ進む`,
                            () => {
                                closeModal();
                                sessionCount = 0;
                                currentRound++;
                                saveRound();
                                initShuffle('all');
                                showCard();
                            }
                        );
                    } else {
                        showModal('round_perfect',
                            `🎉✨ 第${finishedRound}周目 パーフェクト達成！！ ✨🎉\n\n全240問すべて正解しました！\n素晴らしい実力です！`,
                            `第${finishedRound + 1}周へ進む`,
                            () => {
                                closeModal();
                                sessionCount = 0;
                                currentRound++;
                                saveRound();
                                initShuffle('all');
                                showCard();
                            },
                            `一覧を見る`,
                            () => {
                                closeModal();
                                sessionCount = 0;
                                switchTab('list');
                            }
                        );
                    }
                    return;
                } else if (learningMode === 'review') {
                    // === 復習モード完走時 ===
                    const remainingMistakes = getReviewWords().length;
                    if (remainingMistakes === 0) {
                        showModal('review_complete',
                            `🎉 克服完了！！\n\n間違えた問題をすべて正解（〇）にできました！\n苦手単語ゼロ達成です！素晴らしい！`,
                            `全問モードに戻る`,
                            () => {
                                closeModal();
                                sessionCount = 0;
                                setMode('all');
                            }
                        );
                    } else {
                        showModal('review_continue',
                            `復習モード1周終了！\nまだ苦手な問題が ${remainingMistakes}問 残っています。\nもう一度復習しますか？`,
                            `残りの${remainingMistakes}問を復習する`,
                            () => {
                                closeModal();
                                initShuffle('review');
                                showCard();
                            },
                            `全問モードに戻る`,
                            () => {
                                closeModal();
                                sessionCount = 0;
                                setMode('all');
                            }
                        );
                    }
                    return;
                }
            }

            // 30問ごとの休憩チェック（完走時以外）
            if (sessionCount >= SESSION_LIMIT) {
                showModal('session', `🎉 ${SESSION_LIMIT}問クリアしました！\nお疲れ様です。少し休憩しますか？`, 'このまま続ける', () => {
                    sessionCount = 0;
                    closeModal();
                    showCard();
                }, '休んで一覧を見る', () => {
                    sessionCount = 0;
                    closeModal();
                    switchTab('list');
                });
            } else {
                showCard();
            }
        };

        document.addEventListener('keydown', function(event) {
            if (document.getElementById('flashcard-area').classList.contains('hidden')) return;
            if (document.getElementById('unified-modal').classList.contains('hidden') === false) return;
            if (event.key === 'Enter') {
                event.preventDefault();
                if (isFlipped) return; 
                flipCard();
            }
        });

        window.switchTab = function(tabId) {
            const flashcardArea = document.getElementById('flashcard-area');
            const listArea = document.getElementById('list-area');
            const tabFlashcard = document.getElementById('tab-flashcard');
            const tabList = document.getElementById('tab-list');

            if (tabId === 'flashcard') {
                flashcardArea.classList.remove('hidden');
                flashcardArea.classList.add('flex');
                listArea.classList.add('hidden');
                listArea.classList.remove('flex');
                
                tabFlashcard.className = "px-4 py-2 bg-white text-gray-900 rounded-xl shadow-md font-bold focus:outline-none focus:ring-2 focus:ring-white transition-all";
                tabList.className = "px-4 py-2 bg-black/20 text-white border border-white/20 rounded-xl shadow-sm font-bold hover:bg-black/30 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all";
                showCard();
            } else {
                flashcardArea.classList.add('hidden');
                flashcardArea.classList.remove('flex');
                listArea.classList.remove('hidden');
                listArea.classList.add('flex');

                tabList.className = "px-4 py-2 bg-white text-gray-900 rounded-xl shadow-md font-bold focus:outline-none focus:ring-2 focus:ring-white transition-all";
                tabFlashcard.className = "px-4 py-2 bg-black/20 text-white border border-white/20 rounded-xl shadow-sm font-bold hover:bg-black/30 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all";
                
                updateList();
            }
        };

        window.setListFilter = function(filter) {
            listFilter = filter;
            const btnReview = document.getElementById('filter-review-btn');
            const btnAll = document.getElementById('filter-all-btn');
            if (btnReview && btnAll) {
                if (filter === 'review') {
                    btnReview.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-900 shadow transition-all";
                    btnAll.className = "px-4 py-1.5 rounded-full text-xs font-bold text-white/80 hover:text-white transition-all";
                } else {
                    btnAll.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-900 shadow transition-all";
                    btnReview.className = "px-4 py-1.5 rounded-full text-xs font-bold text-white/80 hover:text-white transition-all";
                }
            }
            updateList();
        };

        function updateList() {
            const tbody = document.getElementById('mistake-list-body');
            const noMsg = document.getElementById('no-mistakes-msg');
            tbody.innerHTML = '';

            let displayWords = [];
            if (listFilter === 'review') {
                displayWords = wordData.filter(word => getWordLatestResult(word) === '×');
            } else {
                displayWords = wordData.filter(word => word.mistakes > 0 || (word.history && word.history.length > 0));
            }

            if (displayWords.length === 0) {
                document.querySelector('table').classList.add('hidden');
                noMsg.classList.remove('hidden');
                if (listFilter === 'review') {
                    noMsg.innerHTML = '現在、要復習（直近×）の単語はありません！<br>すべて克服済みです。素晴らしい！🎉';
                } else {
                    noMsg.innerHTML = 'まだ履歴のある単語はありません。どんどん問題を解いていきましょう！📚';
                }
                return;
            } else {
                document.querySelector('table').classList.remove('hidden');
                noMsg.classList.add('hidden');
            }

            displayWords.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];
                
                if (currentSort.key === 'mistakes') {
                    return currentSort.order === 'asc' ? valA - valB : valB - valA;
                } else {
                    if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                    return 0;
                }
            });

            ['en', 'ja', 'mistakes'].forEach(key => {
                document.getElementById(`sort-icon-${key}`).textContent = '';
            });
            document.getElementById(`sort-icon-${currentSort.key}`).textContent = currentSort.order === 'asc' ? '▲' : '▼';

            displayWords.forEach(word => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100 hover:bg-orange-50/50 transition-colors";
                
                const isCurrentMistake = getWordLatestResult(word) === '×';
                const statusBadge = isCurrentMistake
                    ? '<span class="bg-red-500 text-white text-[11px] px-2 py-0.5 rounded-full font-bold shadow-sm inline-block">要復習 (×)</span>'
                    : '<span class="bg-emerald-500 text-white text-[11px] px-2 py-0.5 rounded-full font-bold shadow-sm inline-block">克服済み (〇)</span>';

                const historyHtml = (word.history || []).map(mark => 
                    mark === '〇' ? '<span class="text-green-600 font-bold mx-1">〇</span>' : '<span class="text-red-600 font-bold mx-1">×</span>'
                ).join('');

                tr.innerHTML = `
                    <td class="px-5 py-4 text-sm font-bold text-gray-800">
                        <div class="flex items-center gap-2">
                            <span>${word.en}</span>
                            ${statusBadge}
                        </div>
                    </td>
                    <td class="px-5 py-4 text-sm text-gray-600">${word.ja}</td>
                    <td class="px-5 py-4 text-sm">
                        <div class="font-bold text-gray-700 mb-1">通算ミス: <span class="text-red-600 font-bold">${word.mistakes}回</span></div>
                        <div class="text-xs bg-gray-50 px-2 py-1 rounded inline-block border border-gray-200">
                            直近: ${historyHtml || '<span class="text-gray-400">記録なし</span>'}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.sortTable = function(key) {
            if (currentSort.key === key) {
                currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.order = key === 'mistakes' ? 'desc' : 'asc';
            }
            updateList();
        };

        function showModal(type, message, btn1Text, btn1Action, btn2Text = null, btn2Action = null) {
            const modal = document.getElementById('unified-modal');
            const msgEl = document.getElementById('modal-message');
            const btn1 = document.getElementById('modal-btn-primary');
            const btn2 = document.getElementById('modal-btn-secondary');
            
            msgEl.innerHTML = message.replace(/\n/g, '<br>');
            
            btn1.textContent = btn1Text;
            btn1.onclick = btn1Action;
            
            if (btn2Text) {
                btn2.textContent = btn2Text;
                btn2.classList.remove('hidden');
                btn2.onclick = btn2Action;
            } else {
                btn2.classList.add('hidden');
            }
            
            if (type === 'danger') {
                btn1.classList.replace('bg-blue-600', 'bg-red-600');
                btn1.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
                btn1.classList.replace('focus:ring-blue-300', 'focus:ring-red-300');
            } else {
                btn1.classList.replace('bg-red-600', 'bg-blue-600');
                btn1.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
                btn1.classList.replace('focus:ring-red-300', 'focus:ring-blue-300');
            }
            
            modal.classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('unified-modal').classList.add('hidden');
        };

        window.initiateReset = function() {
            showModal('danger', 'すべての単語の正誤履歴をリセットしてよろしいですか？\nこの操作は元に戻せません。', 'はい、リセットします', () => {
                showModal('danger', '本当にリセットしてよろしいですか？\n（合言葉が同じ他の端末の履歴も消えます）', '最終確認：リセットする', () => {
                    executeReset();
                    closeModal();
                }, 'キャンセル', closeModal);
            }, 'キャンセル', closeModal);
        };

        function executeReset() {
            wordData.forEach(word => {
                word.mistakes = 0;
                word.history = [];
                word.latestResult = null;
            });
            sessionCount = 0;
            currentRound = 1;
            saveRound();
            updateReviewBadge();
            learningMode = 'all';
            updateModeUI();
            initShuffle('all');
            initShuffle('review');
            saveCloudData();
            showCard();
            if(!document.getElementById('list-area').classList.contains('hidden')){
                updateList();
            }
        }

        window.onload = function() {
            totalWordsDisplay.textContent = wordData.length;
            saveRound();
            setupCloudSync();
        };
    </script>
</body>
</html>
